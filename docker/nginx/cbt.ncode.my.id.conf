# Vhost CBT React — HANYA varian satu server (lihat docker-compose.cbt.yml).
# Domain contoh: cbt.ncode.my.id (ganti sesuai DNS Anda).
# File ini di-mount ke service `nginx` hanya bila override dipakai.
# Pastikan `dist/` sudah ada: di VPS jalankan `npm run build` di folder cbt/
# dengan VITE_API_BASE_URL=https://admin.ncode.my.id/api/cbt sebelum up.
server {
    listen 80;
    server_name cbt.ncode.my.id;

    root /var/www/cbt/dist;
    index index.html;

    # Aset Vite React (hash di nama file → cache lama aman)
    location /assets/ {
        try_files $uri $uri/ =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: semua route React kembali ke index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
