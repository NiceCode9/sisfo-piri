    <!--
      Font wajib dimuat di sini, bukan mengandalkan fallback sistem:

      operasional (nomor grid, digit timer, badge, label tombol).
      Material Symbols Outlined dipakai lewat <Icon> di src/components/Icon.tsx.
      Preconnect dipakai karena stylesheet ini挡住了 first paint di ruang ujian.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
      rel="stylesheet"
    />
  </head>
