<!doctype html>
<html lang="id" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nexus Admin — Session Expired" />
    <title>Nexus Admin — 419</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="error-body">
    <canvas id="particleCanvas"></canvas>

    <div class="error-wrapper">
      <div class="error-icon-wrap" style="background: rgba(239,68,68,0.12); color: #ef4444;">
        <i class="fa-solid fa-hourglass-end"></i>
      </div>
      <div class="error-code">419</div>
      <div class="error-title">Session Expired</div>
      <div class="error-text">
        Your session has timed out due to inactivity.<br />
        Please sign in again to continue where you left off.
      </div>
      <div class="error-actions">
        <a href="login.html" class="btn btn-primary">
          <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In Again
        </a>
        <a href="index.html" class="btn btn-nexus-outline">
          <i class="fa-solid fa-house"></i> Home
        </a>
      </div>
    </div>

    <script src="particles.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
