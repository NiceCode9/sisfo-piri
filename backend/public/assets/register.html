<!doctype html>
<html lang="id" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nexus Admin — Register" />
    <title>Nexus Admin — Register</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="auth-body">
    <canvas id="particleCanvas"></canvas>

    <div class="auth-wrapper">
      <div class="auth-card">
        <div class="auth-header">
          <div class="auth-logo"><i class="fa-solid fa-hexagon"></i></div>
          <div class="auth-title">Create Account</div>
          <div class="auth-subtitle">Get started with Nexus Admin</div>
        </div>

        <div class="auth-alert" id="registerAlert" style="display: none;">
          <i class="fa-solid fa-circle-check"></i>
          <span>Account created successfully! Redirecting...</span>
        </div>

        <form onsubmit="return handleRegister(event)">
          <div class="row g-3 mb-3">
            <div class="col-6 form-group">
              <label class="form-label" for="regFirst">First Name</label>
              <input type="text" class="form-control" id="regFirst" placeholder="John" required />
            </div>
            <div class="col-6 form-group">
              <label class="form-label" for="regLast">Last Name</label>
              <input type="text" class="form-control" id="regLast" placeholder="Doe" required />
            </div>
          </div>
          <div class="mb-3 form-group">
            <label class="form-label" for="regEmail">Email Address</label>
            <input type="email" class="form-control" id="regEmail" placeholder="you@example.com" autocomplete="email" required />
          </div>
          <div class="mb-3 form-group">
            <label class="form-label" for="regPassword">Password</label>
            <div class="position-relative">
              <input type="password" class="form-control" id="regPassword" placeholder="Create a strong password" autocomplete="new-password" required minlength="8" />
              <button type="button" class="btn btn-sm position-absolute end-0 top-50 translate-middle-y border-0 bg-transparent text-muted" onclick="togglePassword('regPassword', this)" tabindex="-1">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
            <div style="font-size: 11px; color: var(--text-muted); margin-top: 6px;">
              <i class="fa-solid fa-circle-info"></i> Minimum 8 characters
            </div>
          </div>
          <div class="mb-4 form-group">
            <label class="form-label" for="regConfirm">Confirm Password</label>
            <div class="position-relative">
              <input type="password" class="form-control" id="regConfirm" placeholder="Confirm your password" autocomplete="new-password" required />
              <button type="button" class="btn btn-sm position-absolute end-0 top-50 translate-middle-y border-0 bg-transparent text-muted" onclick="togglePassword('regConfirm', this)" tabindex="-1">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
          </div>
          <div class="mb-4">
            <div class="form-check">
              <input type="checkbox" class="form-check-input" id="agreeTerms" required />
              <label class="form-check-label" for="agreeTerms" style="font-size: 13px; color: var(--text-secondary);">
                I agree to the <a href="#" style="color: var(--accent-primary); text-decoration: none; font-weight: 600;">Terms of Service</a> &amp; <a href="#" style="color: var(--accent-primary); text-decoration: none; font-weight: 600;">Privacy Policy</a>
              </label>
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2">
            <i class="fa-solid fa-user-plus"></i> Create Account
          </button>
        </form>

        <div class="auth-divider">or continue with</div>

        <div class="d-flex gap-2">
          <button class="social-btn"><i class="fa-brands fa-google"></i> Google</button>
          <button class="social-btn"><i class="fa-brands fa-github"></i> GitHub</button>
        </div>

        <div class="auth-footer">
          Already have an account? <a href="login.html">Sign in</a>
        </div>
      </div>
    </div>

    <script>
      function togglePassword(id, btn) {
        const input = document.getElementById(id);
        const icon = btn.querySelector('i');
        if (input.type === 'password') {
          input.type = 'text';
          icon.className = 'fa-solid fa-eye-slash';
        } else {
          input.type = 'password';
          icon.className = 'fa-solid fa-eye';
        }
      }

      function handleRegister(e) {
        e.preventDefault();
        const pwd = document.getElementById('regPassword').value;
        const confirm = document.getElementById('regConfirm').value;
        const alert = document.getElementById('registerAlert');

        if (pwd !== confirm) {
          alert.style.display = 'flex';
          alert.className = 'auth-alert';
          alert.querySelector('i').className = 'fa-solid fa-circle-exclamation';
          alert.querySelector('span').textContent = 'Passwords do not match.';
          return false;
        }

        alert.style.display = 'flex';
        alert.className = 'auth-alert success';
        alert.querySelector('i').className = 'fa-solid fa-circle-check';
        alert.querySelector('span').textContent = 'Account created successfully! Redirecting...';
        setTimeout(() => { window.location.href = 'login.html'; }, 1500);
        return false;
      }
    </script>

    <script src="particles.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
