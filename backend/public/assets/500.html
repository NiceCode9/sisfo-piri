<!doctype html>
<html lang="id" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nexus Admin — Server Error" />
    <title>Nexus Admin — 500</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="error-body">
    <canvas id="particleCanvas"></canvas>

    <div class="error-wrapper">
      <div class="error-icon-wrap" style="background: rgba(239,68,68,0.12); color: #ef4444;">
        <i class="fa-solid fa-bug"></i>
      </div>
      <div class="error-code">500</div>
      <div class="error-title">Server Error</div>
      <div class="error-text">
        Something went wrong on our end. We're working on it.<br />
        Please try again later or contact support if the issue persists.
      </div>
      <div class="error-actions">
        <a href="index.html" class="btn btn-primary">
          <i class="fa-solid fa-rotate"></i> Try Again
        </a>
        <a href="mailto:support@nexusapp.io" class="btn btn-nexus-outline">
          <i class="fa-solid fa-envelope"></i> Contact Support
        </a>
      </div>
    </div>

    <script src="particles.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
