<!doctype html>
<html lang="id" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nexus Admin — Page Not Found" />
    <title>Nexus Admin — 404</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="error-body">
    <canvas id="particleCanvas"></canvas>

    <div class="error-wrapper">
      <div class="error-icon-wrap" style="background: rgba(245,158,11,0.12); color: #f59e0b;">
        <i class="fa-solid fa-map-pin"></i>
      </div>
      <div class="error-code">404</div>
      <div class="error-title">Page Not Found</div>
      <div class="error-text">
        The page you are looking for doesn't exist or has been moved.<br />
        Check the URL or head back to the dashboard.
      </div>
      <div class="error-actions">
        <a href="index.html" class="btn btn-primary">
          <i class="fa-solid fa-house"></i> Back to Dashboard
        </a>
        <a href="#" onclick="history.back(); return false;" class="btn btn-nexus-outline">
          <i class="fa-solid fa-arrow-left"></i> Go Back
        </a>
      </div>
    </div>

    <script src="particles.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
